[project]
name = "mental-health-llm"
version = "0.1.0"
description = "Mental Health Counseling LLM using Qwen2.5"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "datasets>=2.20.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "peft>=0.12.0",
    "evaluate>=0.4.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "wandb>=0.17.0",
    "tensorboard>=2.17.0",
]

[project.optional-dependencies]
cuda = [
    "bitsandbytes>=0.41.0",
    "trl>=0.7.0",
]
telegram = ["python-telegram-bot>=21.0", "faster-whisper>=1.0.0"]
eval = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "krippendorff>=0.7.0",
    "scipy>=1.12.0",
    "tabulate>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mental_health_llm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
